<style>
/* Lámina de arquitecto: cajetín arriba y la lámina (planta 2D o modelo 3D) al centro. */
:root{

  --accent:#2a5a86; --floor2d:#e7ecf0; --floor3d:#d9d3c7; --wall3d:#f4f3ef; --halo:#fbfbfa; --stair:#f3cf96; --barc:#cdb6e6;

  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#10161c;--sheet:#141c23;--ink:#dfe6ec;--muted:#93a1ad;--rule:#2a3540;--accent:#79acd9;--floor2d:#1c2731;--floor3d:#5e5a52;--wall3d:#d8d6d0;--halo:#141c23;--stair:#7a5a2a;--barc:#5a4675;color-scheme:dark}}
:root[data-theme="dark"]{--paper:#10161c;--sheet:#141c23;--ink:#dfe6ec;--muted:#93a1ad;--rule:#2a3540;--accent:#79acd9;--floor2d:#1c2731;--floor3d:#5e5a52;--wall3d:#d8d6d0;--halo:#141c23;--stair:#7a5a2a;--barc:#5a4675;color-scheme:dark}
body{background:var(--paper);color:var(--ink);font-family:var(--f-ui)}
.wrap{max-width:1100px;margin:0 auto;padding-inline:16px;padding-block:20px 28px;display:grid;gap:14px}
.cajetin{display:grid;grid-template-columns:1fr auto;gap:12px 24px;align-items:end;border-bottom:2px solid var(--ink);padding-bottom:12px}
.cajetin h1{font-family:var(--f-title);font-weight:600;font-size:34px;line-height:1;letter-spacing:.02em;margin:0;text-transform:uppercase;text-wrap:balance}
@media (max-width:560px){.cajetin{grid-template-columns:minmax(0,1fr)}.cajetin h1{font-size:28px}}
.cajetin>*{min-width:0}
.cajetin .meta{display:grid;grid-template-columns:auto auto;gap:2px 14px;font-size:12px}
.meta dt{color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-size:10.5px;align-self:center}
.meta dd{margin:0;font-family:var(--f-num);font-variant-numeric:tabular-nums}
.controles{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.grupo{display:inline-flex;border:1px solid var(--ink);border-radius:2px;overflow:hidden}
.grupo button{font:inherit;font-size:12.5px;letter-spacing:.06em;text-transform:uppercase;padding:8px 14px;border:0;background:transparent;color:var(--ink);cursor:pointer}
.grupo button+button{border-left:1px solid var(--ink)}
.grupo button[aria-pressed="true"]{background:var(--ink);color:var(--sheet)}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.lamina{background:var(--sheet);border:1px solid var(--rule);position:relative;aspect-ratio:3/4;width:min(100%,780px);max-width:100%;margin:0 auto}
.lamina svg,.lamina canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#v3d{touch-action:none}
.ayuda{position:absolute;left:12px;bottom:10px;font-size:11px;color:var(--muted);pointer-events:none}
svg text{font-family:var(--f-num)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

  for(let z=Math.floor(minZ-M);z<=maxZ+M+3;z++) el('line',{x1:minX-M,y1:z,x2:maxX+M,y2:z,opacity:z%5?0.35:0.8},g);
  el('polygon',{points:D.piso.map(p=>p.join(',')).join(' '),fill:css('--floor2d')});
  const gw=el('g',{stroke:css('--ink'),'stroke-linecap':'square'});
  for(const w of D.walls){
    if(w.k==='c'||w.k==='d') continue;
    if(w.k==='a') el('line',{x1:w.a[0],y1:w.a[1],x2:w.b[0],y2:w.b[1],'stroke-width':0.07,'stroke-dasharray':'0.5 0.35',stroke:css('--accent')},svg);
    else el('line',{x1:w.a[0],y1:w.a[1],x2:w.b[0],y2:w.b[1],'stroke-width':0.42},gw);
  }
  // cotas
  const gt=el('g',{'font-size':0.8,fill:css('--ink'),'text-anchor':'middle',stroke:css('--halo'),'stroke-width':0.22,'paint-order':'stroke','stroke-linejoin':'round'});
  for(const w of D.walls){
    if(!w.t) continue;
    const [x1,z1]=w.a,[x2,z2]=w.b, L=Math.hypot(x2-x1,z2-z1); if(L<1.2) continue;
    let ang=Math.atan2(z2-z1,x2-x1)*180/Math.PI; if(ang>90)ang-=180; if(ang<=-90)ang+=180;
    const mx=(x1+x2)/2, mz=(z1+z2)/2;
    let nx=-(z2-z1)/L, nz=(x2-x1)/L; // normal
    if((cx-mx)*nx+(cz-mz)*nz<0){nx=-nx;nz=-nz;}
    const t=el('text',{x:mx+nx*0.85,y:mz+nz*0.85,transform:`rotate(${ang} ${mx+nx*0.85} ${mz+nz*0.85})`,'dominant-baseline':'central'},gt);
    t.textContent=cota(w.t);
  }
  // escalera, vacío y bar
  const pts=P=>P.map(p=>p.join(',')).join(' ');
  el('polygon',{points:pts(D.barPoly),fill:css('--barc')},svg);
  el('polygon',{points:pts(D.escalera),fill:css('--stair'),stroke:css('--ink'),'stroke-width':0.05},svg);
  { const [a,b]=[D.escalera[0],D.escalera[1]]; const gE=el('g',{stroke:css('--ink'),'stroke-width':0.04},svg);
    const cp=el('clipPath',{id:'cE'},svg); el('polygon',{points:pts(D.escalera)},cp); gE.setAttribute('clip-path','url(#cE)');
    const ux=(b[0]-a[0]),uz=(b[1]-a[1]),L=Math.hypot(ux,uz),nx=-uz/L,nz=ux/L;
    for(let t=0.9;t<L;t+=0.9){const px=a[0]+ux/L*t,pz=a[1]+uz/L*t; el('line',{x1:px-nx*8,y1:pz-nz*8,x2:px+nx*8,y2:pz+nz*8},gE);} }
  el('polygon',{points:pts(D.vacio),fill:'none',stroke:css('--muted'),'stroke-width':0.04},svg);
  { const v=D.vacio, g2=el('g',{stroke:css('--muted'),'stroke-width':0.04},svg); el('line',{x1:v[0][0],y1:v[0][1],x2:v[3][0],y2:v[3][1]},g2); el('line',{x1:v[2][0],y1:v[2][1],x2:v[5][0],y2:v[5][1]},g2); }
  const rot=(x,y,txt,fs,col,ang)=>{const t=el('text',{x,y,'font-size':fs,'text-anchor':'middle','dominant-baseline':'central',fill:col,'font-family':'IBM Plex Sans, sans-serif','letter-spacing':0.05,transform:`rotate(${ang||0} ${x} ${y})`},svg);t.textContent=txt;};
  { const c=D.escalera.reduce((a,p)=>[a[0]+p[0]/5,a[1]+p[1]/5],[0,0]); rot(c[0]+0.5,c[1]-0.2,'ESCALERA ↓',0.75,css('--ink'),72); }
  rot(D.vacio[0][0]+2.4,D.vacio[0][1]+2.0,'VACÍO',0.7,css('--muted'),0);
  rot(D.bar[0]+0.3,D.bar[1]-0.2,'BAR',0.8,css('--ink'),-48);
  // ventanas: tres líneas finas sobre la pared
  for(const w of D.walls){ if(!w.win) continue;
    const [x1,z1]=w.a,[x2,z2]=w.b,L=Math.hypot(x2-x1,z2-z1),ux=(x2-x1)/L,uz=(z2-z1)/L,m=0.8;
    const a=[x1+ux*m,z1+uz*m],b=[x2-ux*m,z2-uz*m];
    el('line',{x1:a[0],y1:a[1],x2:b[0],y2:b[1],stroke:css('--sheet'),'stroke-width':0.44},svg);
    for(const o of [-0.17,0,0.17]) el('line',{x1:a[0]-uz*o,y1:a[1]+ux*o,x2:b[0]-uz*o,y2:b[1]+ux*o,stroke:css('--accent'),'stroke-width':0.05},svg);
  }
  // puertas: hoja abierta a 90° y su arco de giro
  for(const d of D.doors){
    const [hx,hz]=d.h,[ox,oz]=d.o,w=Math.hypot(ox-hx,oz-hz),[nx,nz]=d.n, ex=hx+nx*w, ez=hz+nz*w;
    el('line',{x1:hx,y1:hz,x2:ox,y2:oz,stroke:css('--sheet'),'stroke-width':0.46},svg);
    const cr=((ox-hx)*nz-(oz-hz)*nx)>0?0:1;
    el('path',{d:`M${ex} ${ez} A${w} ${w} 0 0 ${cr} ${ox} ${oz}`,fill:'none',stroke:css('--accent'),'stroke-width':0.05,'stroke-dasharray':'0.25 0.15'},svg);
    el('line',{x1:hx,y1:hz,x2:ex,y2:ez,stroke:css('--ink'),'stroke-width':0.12},svg);
  }
  // ambientes
  D.rooms.forEach(r=>{
    const area=unidad==='ft'?`${r.ft2} ft²`:`${coma(r.m2)} m²`;
    if(r.k==='pend') return;
    const chico=r.ft2<45, nom=r.n.toUpperCase();
    if(chico){ rot(r.c[0],r.c[1]-0.3,nom,0.55,css('--ink'),0); rot(r.c[0],r.c[1]+0.38,area,0.42,css('--muted'),0); return; }
    const tn=el('text',{x:r.c[0],y:r.c[1]-0.45,'font-size':r.k==='hab'||r.n==='Sala'?0.95:0.75,'text-anchor':'middle','dominant-baseline':'central',fill:css('--ink'),'font-weight':600,'font-family':'IBM Plex Sans, sans-serif'},svg); tn.textContent=r.n;
    const b=el('text',{x:r.c[0],y:r.c[1]+0.55,'font-size':0.6,'text-anchor':'middle','dominant-baseline':'central',fill:css('--muted')},svg); b.textContent=area;
  });
  // escala gráfica
  const sx=minX, sz=maxZ+M-0.6, paso=unidad==='ft'?5:1/0.3048, n=unidad==='ft'?2:3;
  const ge=el('g',{},svg);
  for(let i=0;i<n;i++) el('rect',{x:sx+i*paso,y:sz,width:paso,height:0.35,fill:i%2?css('--sheet'):css('--ink'),stroke:css('--ink'),'stroke-width':0.05},ge);
  for(let i=0;i<=n;i++){const t=el('text',{x:sx+i*paso,y:sz+1.15,'font-size':0.6,'text-anchor':'middle',fill:css('--ink')},ge);t.textContent=unidad==='ft'?`${i*5}′`:`${i} m`;}
  const lt=el('text',{x:sx+n*paso+0.8,y:sz+0.3,'font-size':0.6,fill:css('--muted')},ge); lt.textContent='ESCALA GRÁFICA';
}

/* ---------- Modelo 3D ---------- */
let r3=null;
function iniciar3D(){
  if(r3) return; if(!window.THREE){document.getElementById('ayuda').textContent='No se pudo cargar el visor 3D. Recarga la página.';return;}
  const canvas=document.getElementById('v3d');
  const renderer=new THREE.WebGLRenderer({canvas,antialias:true});
  renderer.setPixelRatio(Math.min(devicePixelRatio,2)); renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFSoftShadowMap;
  const scene=new THREE.Scene(), cam=new THREE.PerspectiveCamera(40,1,0.1,1000);
  const ctr=new THREE.OrbitControls(cam,canvas); ctr.enableDamping=true; ctr.maxPolarAngle=Math.PI/2-0.03;
  const span=Math.max(maxX-minX,maxZ-minZ);
  const g=new THREE.Group(); g.position.set(-cx,0,-cz); scene.add(g);
  scene.add(new THREE.HemisphereLight(0xffffff,0x9aa0a6,0.65));
  const sol=new THREE.DirectionalLight(0xffffff,0.6); sol.position.set(-25,55,30); sol.castShadow=true;
  sol.shadow.mapSize.set(2048,2048); Object.assign(sol.shadow.camera,{left:-45,right:45,top:45,bottom:-45,near:1,far:150}); scene.add(sol);
  const mVidrio=new THREE.MeshLambertMaterial({color:0x9fc3dd,transparent:true,opacity:0.35}), mPiso=new THREE.MeshLambertMaterial({side:THREE.DoubleSide}), mPared=new THREE.MeshLambertMaterial(), mBase=new THREE.MeshLambertMaterial();
  const base=new THREE.Mesh(new THREE.PlaneGeometry(span*3,span*3),mBase); base.rotation.x=-Math.PI/2; base.position.y=-0.02; base.receiveShadow=true; scene.add(base);
  const piso=new THREE.Mesh(new THREE.ShapeGeometry(new THREE.Shape(D.piso.map(p=>new THREE.Vector2(p[0],p[1])))),mPiso);
  piso.rotation.x=Math.PI/2; piso.receiveShadow=true; g.add(piso);
  const H=2.75/0.3048, T=0.42, mLinea=new THREE.LineBasicMaterial({transparent:true,opacity:0.35});
  for(const w of D.walls){
    const [x1,z1]=w.a,[x2,z2]=w.b,dx=x2-x1,dz=z2-z1,L=Math.hypot(dx,dz);
    if(w.k==='a'){const l=new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(x1,0.04,z1),new THREE.Vector3(x2,0.04,z2)]),new THREE.LineDashedMaterial({dashSize:0.5,gapSize:0.35}));l.computeLineDistances();l.userData.dash=true;g.add(l);continue;}
    const rotY=-Math.atan2(dz,dx), mx=(x1+x2)/2, mz=(z1+z2)/2;
    const pieza=(largo,alto,y0,off,mat)=>{const geo=new THREE.BoxGeometry(largo,alto,T), m=new THREE.Mesh(geo,mat||mPared);
      m.position.set(mx+Math.cos(-rotY)*off,y0+alto/2,mz+Math.sin(-rotY)*off); m.rotation.y=rotY; m.castShadow=m.receiveShadow=true;
      if(!mat) m.add(new THREE.LineSegments(new THREE.EdgesGeometry(geo),mLinea)); g.add(m);};
    if(w.k==='c') continue;
    if(w.k==='d'){ pieza(L,H-2.1/0.3048,2.1/0.3048,0); continue; }
    if(w.bajo){ pieza(L+T,1.0/0.3048,0,0); continue; }
    if(w.win){ const s0=0.9/0.3048, s1=2.2/0.3048, lado=0.8, hueco=L-2*lado;
      pieza(lado+T/2,H,0,-(L/2-lado/2)+(-T/4)); pieza(lado+T/2,H,0,(L/2-lado/2)+T/4);
      pieza(hueco,s0,0,0); pieza(hueco,H-s1,s1,0); pieza(hueco,s1-s0,s0,0,mVidrio); continue; }
    pieza(L+T,H,0,0);
  }
  const mPuerta=new THREE.MeshLambertMaterial({color:0x9a7650});
  for(const d of D.doors){
    const [hx,hz]=d.h,[ox,oz]=d.o,w=Math.hypot(ox-hx,oz-hz),[nx,nz]=d.n, hp=2.1/0.3048;
    const m=new THREE.Mesh(new THREE.BoxGeometry(w-0.15,hp,0.12),mPuerta);
    m.position.set(hx+nx*w/2,hp/2,hz+nz*w/2); m.rotation.y=-Math.atan2(nz,nx); m.castShadow=true; g.add(m);
  }
  const cartel=(txt,x,z,y)=>{const c=document.createElement('canvas'),k=c.getContext('2d'),fs=40;k.font=`600 ${fs}px "IBM Plex Sans", sans-serif`;
    const w=Math.ceil(k.measureText(txt).width)+28,h=fs+20;c.width=w;c.height=h;k.fillStyle='rgba(27,39,51,0.85)';k.fillRect(0,0,w,h);
    k.fillStyle='#ffffff';k.font=`600 ${fs}px "IBM Plex Sans", sans-serif`;k.textBaseline='middle';k.fillText(txt,14,h/2+1);
    const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(c),depthTest:false,transparent:true}));sp.scale.set(w*0.045,h*0.045,1);sp.position.set(x,y,z);sp.renderOrder=10;g.add(sp);};
  D.rooms.forEach(r=>{ if(r.k==='pend'||r.k==='otro'&&r.n==='Pasillo') return; if(r.k==='bano'||r.k==='otro') return; cartel(r.n,r.c[0],r.c[1],H+2.2); });
  { const c=D.escalera.reduce((a,p)=>[a[0]+p[0]/5,a[1]+p[1]/5],[0,0]); cartel('Escalera',c[0],c[1],H+1.4); }
  cartel('Bar',D.bar[0],D.bar[1],H+0.8);
  function colores(){scene.background=new THREE.Color(css('--sheet'));mBase.color.set(css('--paper'));mPiso.color.set(css('--floor3d'));mPared.color.set(css('--wall3d'));mLinea.color.set(css('--ink'));g.children.forEach(c=>{if(c.userData.dash)c.material.color.set(css('--accent'));});}
  colores();
  function tam(){const w=canvas.clientWidth,h=canvas.clientHeight;if(!w||!h)return;renderer.setSize(w,h,false);cam.aspect=w/h;cam.updateProjectionMatrix();}
  new ResizeObserver(tam).observe(canvas);
  const k=canvas.clientHeight>canvas.clientWidth?1.35:1; cam.position.set(span*0.5*k,span*1.0*k,span*0.95*k); ctr.target.set(0,0,0); ctr.update(); tam();
  (function loop(){requestAnimationFrame(loop);ctr.update();renderer.render(scene,cam);})();
  r3={colores};
}

/* ---------- Controles ---------- */
const t2=document.getElementById('t2d'),t3=document.getElementById('t3d'),uf=document.getElementById('uft'),um=document.getElementById('um');
function verVista(v){
  const es3=v==='3d'; document.getElementById('v2d').hidden=es3; document.getElementById('v3d').hidden=!es3; document.getElementById('ayuda').hidden=!es3;
  t2.setAttribute('aria-pressed',String(!es3)); t3.setAttribute('aria-pressed',String(es3));
  document.getElementById('lam').textContent=es3?'Modelo · 3D':'Planta alta · 2D'; if(es3) iniciar3D();
}
t2.onclick=()=>verVista('2d'); t3.onclick=()=>verVista('3d');
function verUnidad(u){unidad=u;uf.setAttribute('aria-pressed',String(u==='ft'));um.setAttribute('aria-pressed',String(u==='m'));dibujar2D();}
uf.onclick=()=>verUnidad('ft'); um.onclick=()=>verUnidad('m');
document.getElementById('areaTot').textContent=`${coma(D.total_m2)} m²`;
function retema(){dibujar2D(); r3&&r3.colores();}
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',retema);
new MutationObserver(retema).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});
dibujar2D(); document.fonts&&document.fonts.ready.then(dibujar2D);
if(location.hash==='#3d') verVista('3d');
</script>
